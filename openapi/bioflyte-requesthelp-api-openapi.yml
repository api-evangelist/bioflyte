openapi: 3.2.0
info:
  title: Bioflyte Request Help API
  version: '1.0'
  description: 'Operations tagged RequestHelp across 2 of this provider''s published API definitions: bioflyte-portal-openapi-original.json, bioflyte-requesthelp-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://portal.bioflyte.com
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: RequestHelp
paths:
  /RequestHelpSubmit:
    post:
      tags:
      - RequestHelp
      parameters:
      - name: Subject
        in: query
        required: true
        schema:
          type: string
      - name: Comment
        in: query
        required: true
        schema:
          type: string
      - name: NewFileIds
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
x-refined-from:
- bioflyte-portal-openapi-original.json
- bioflyte-requesthelp-api-openapi.yml
