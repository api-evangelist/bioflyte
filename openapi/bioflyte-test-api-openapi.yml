openapi: 3.2.0
info:
  title: AdminWeb Test API
  version: '1.0'
tags:
- name: Test
paths:
  /TestOnSampleReceived:
    post:
      tags:
      - Test
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/NewSampleReceived'
          application/json:
            schema:
              $ref: '#/components/schemas/NewSampleReceived'
          text/json:
            schema:
              $ref: '#/components/schemas/NewSampleReceived'
          application/*+json:
            schema:
              $ref: '#/components/schemas/NewSampleReceived'
      responses:
        '200':
          description: OK
      summary: Create test on sample received
      x-summary-source: derived
      operationId: postTestOnSampleReceived
      x-operation-id-source: derived
  /TestOnAlertsUpdated:
    post:
      tags:
      - Test
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AlertsUpdated'
          application/json:
            schema:
              $ref: '#/components/schemas/AlertsUpdated'
          text/json:
            schema:
              $ref: '#/components/schemas/AlertsUpdated'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AlertsUpdated'
      responses:
        '200':
          description: OK
      summary: Create test on alerts updated
      x-summary-source: derived
      operationId: postTestOnAlertsUpdated
      x-operation-id-source: derived
  /Test/TestOnSampleStatusUpdated:
    get:
      tags:
      - Test
      parameters:
      - name: deviceId
        in: query
        schema:
          type: string
          format: uuid
      - name: isStartEnabled
        in: query
        schema:
          type: boolean
      - name: IsDeviceBuzy
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
      summary: Get test test on sample status updated
      x-summary-source: derived
      operationId: getTestTestOnSampleStatusUpdated
      x-operation-id-source: derived
components:
  schemas:
    NewSampleReceived:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
        sampleId:
          type: string
          format: uuid
      additionalProperties: false
    AlertsUpdated:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        alertId:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
      additionalProperties: false
