apis:
- aid: bioflyte:portal
  name: BioFlyte Customer Portal API (AdminWeb)
  description: 'The HTTP API behind portal.bioflyte.com, the authenticated web console BioFlyte
    customers use to manage deployed BioTOF sensors. The service is an ASP.NET Core (Kestrel)
    application titled "AdminWeb" that publishes an OpenAPI 3.0.1 description openly at
    https://portal.bioflyte.com/swagger/v1/swagger.json together with a Swagger UI at
    /swagger/index.html. The 40 operations are grouped by the Swagger tags Alert, Client, Files,
    Filters, Locations, Organization, Permissions, RequestHelp and Test, and cover alert settings
    and recipients, device/organization/location/user/role/telemetry-type select lists, a device
    location map, file upload and download, permission and role resolution, organization
    switching, a help request, and sample/alert webhook test hooks. Its declared schemas
    (NewSampleReceived, AlertsUpdated, PermissionsReq, LoadLocationMapForDeviceRequest) confirm
    the domain: devices identified by UUID emitting samples and alerts against organizations and
    locations. The DESCRIPTION is public; the API is not. Every operation probed anonymously on
    2026-08-07 returned HTTP 302 to
    https://portal.bioflyte.com/identity/account/login, and no securitySchemes, servers,
    operationIds, summaries, descriptions or non-200 responses are declared in the document.
    BioFlyte does not document, announce or support this as a developer API — it is the private
    backend of its own console, captured here verbatim as published.'
  humanURL: https://portal.bioflyte.com/
  baseURL: https://portal.bioflyte.com
  tags:
  - Devices
  - Alerts
  - Telemetry
  - Locations
  - Organizations
  - Permissions
  - Files
