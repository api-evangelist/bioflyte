aid: bioflyte
name: BioFlyte
description: 'BioFlyte, Inc. is an Albuquerque, New Mexico based biodefense instrument company
  founded in 2020 by Charles Call that commercializes a fieldable class of aerosol time-of-flight
  mass spectrometers for identifying airborne biological and low-volatility chemical threats. Its
  BioTOF z200 bioaerosol identifier autonomously collects, detects and identifies airborne
  biothreats for critical-infrastructure sites such as airports, arenas, transit hubs and federal
  buildings, and its MailScreen z200 workstation identifies hazardous biological powders in mail
  and parcels. The instruments pair an aerosol sample collector with robotic sample handling,
  archiving and UV-laser ionization, then match the resulting mass spectra against a threat
  library using AI/ML algorithms; the threat library and software updates are delivered through
  the cloud and the sensor is operated locally from a Windows-based tablet Command Console.
  BioFlyte has raised a $1.25M seed round (2020), a $6.1M Series A (2022) and a $5.4M Series B
  (2023), holds a U.S. Department of Homeland Security SAFETY Act Qualified Anti-Terrorism
  Technology designation and a U.S. Air Force SBIR Phase II contract, and has run deployments and
  pilots with Pittsburgh International Airport, SoBran and Los Alamos National Laboratory.
  BioFlyte publishes no developer program, API documentation, SDK, portal or pricing page. It
  does run two machine-readable API surfaces that a member of the public can reach: the fleet
  and alerting API behind its customer portal at portal.bioflyte.com, an ASP.NET Core service
  ("AdminWeb") whose OpenAPI 3.0.1 description is served openly at /swagger/v1/swagger.json even
  though every one of its 40 operations redirects an unauthenticated caller to a login page; and
  the anonymously readable WordPress REST API (wp/v2) on www.bioflyte.com, which serves the
  press-release newsroom, the Resources library of blog posts and whitepapers, the marketing
  pages, the media library, taxonomies and site search as JSON.'
