- aid: bioflyte:content
  name: BioFlyte Content API (WordPress REST wp/v2)
  description: 'The anonymously readable WordPress REST API that www.bioflyte.com serves at
    /wp-json/wp/v2 — press releases and news (the `post` type, 36 published across the `news` and
    `press-release` categories), the Resources library of blog posts and whitepapers (the
    `resource` custom post type, 6 published under the `resources-category` terms Blog and
    Whitepapers), the nine marketing pages, a 374-item media library, taxonomies (`category`,
    `post_tag`, `resources-category`, `project_category`, `project_tag`, `difl_page_category`),
    users and a site-wide search endpoint, all as JSON with page/per_page pagination and
    X-WP-Total / X-WP-TotalPages response headers. This is the CMS content API, not a BioFlyte
    product API — the BioTOF z200 and MailScreen z200 instruments expose no public API. BioFlyte
    publishes no OpenAPI for it, so the definition in this repo was derived mechanically from the
    live route-discovery document at https://www.bioflyte.com/wp-json/.'
  humanURL: https://www.bioflyte.com/category/press-release/
  baseURL: https://www.bioflyte.com/wp-json/wp/v2
