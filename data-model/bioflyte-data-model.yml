gaps:
- api: bioflyte:portal
  finding: >-
    Of roughly fourteen entities the operation surface implies, only two carry a published
    payload schema (NewSampleReceived, AlertsUpdated) and none of the core domain objects —
    Device, Organization, Location, Alert, Sample, User, Role — is defined anywhere in the
    document. Thirty-eight of the forty operations declare a 200 "OK" with no response schema,
    so a client cannot know the shape of anything it gets back.
  remedy: >-
    Add response schemas to the Swashbuckle annotations. The types already exist in the C#
    controllers; they are simply not being emitted into the document.
