- api: bioflyte:portal
  note: >-
    The AdminWeb document declares only 8 schemas, all of them thin request/response wrappers,
    so the domain graph below is inferred from those schemas plus the operation names and
    Swagger tags. Field lists are complete for declared schemas and ABSENT for entities that are
    only named (Device, Organization, Location, Alert, Sample, Role, Telemetry Type) — those
    entities have no schema in the published document at all. Nothing here is invented: every
    entity name and every relationship is taken from a declared property name or an operation
    name in the provider's own OpenAPI.
  entities:
  - name: Device
    id_type: uuid
    evidence: >-
      deviceId (uuid) on NewSampleReceived, AlertsUpdated and LoadLocationMapForDeviceRequest;
      operations LoadDevicesSelectList, LoadDeviceAzureSelectList,
      LoadDeviceAzureNotBindedSelectList, LoadDevicesSelectListArchiveDependent,
      LoadDevicesSelectListNotInLocation, LoadDevicesSelectListNotInOrganization,
      LoadDeviceStatusList
    schema_published: false
    relationships:
    - {type: belongs_to, target: Organization, via: 'LoadDevicesSelectListNotInOrganization implies device→organization binding'}
    - {type: belongs_to, target: Location, via: 'LoadDevicesSelectListNotInLocation implies device→location binding'}
    - {type: has_many, target: Sample, via: 'NewSampleReceived.deviceId'}
    - {type: has_many, target: Alert, via: 'AlertsUpdated.deviceId'}
    note: >-
      "DeviceAzure" and "NotBinded" in the operation names indicate devices are registered as
      Azure IoT identities and bound to a portal device record.
  - name: Sample
    id_type: uuid
    evidence: NewSampleReceived.sampleId; operations TestOnSampleReceived, Test/TestOnSampleStatusUpdated
    schema_published: false
    relationships:
    - {type: belongs_to, target: Device, via: deviceId}
  - name: Alert
    id_type: uuid
    evidence: >-
      AlertsUpdated.alertId[]; operations LoadRecipients, LoadAlertSetting,
      LoadAlertSettingDetails, LoadAlertTypeInfo, LoadAlertTypeSelectList,
      LoadAlertSettingsSelectList, LoadAlertTypeFilteredSelectList, LoadAlertStatusSelectList
    schema_published: false
    relationships:
    - {type: belongs_to, target: Device, via: deviceId}
    - {type: belongs_to, target: AlertSetting, via: 'LoadAlertSettingDetails / LoadAlertSettingsSelectList'}
    - {type: has_many, target: Recipient, via: LoadRecipients}
  - name: AlertSetting
    evidence: LoadAlertSetting, LoadAlertSettingDetails, LoadAlertSettingsSelectList, LoadSettingLayerTypesSelectList
    schema_published: false
    note: '"Setting layer types" implies alert settings are layered (e.g. global → organization → location → device).'
  - name: Organization
    id_type: uuid
    evidence: >-
      PermissionsReq.organizationTypeId; operations LoadOrganizationSelectList,
      LoadOrganizationTypeSelectList, LoadOrganizationStatusSelectList, LoadLocationsByOrgId,
      SwitchOrganization
    schema_published: false
    relationships:
    - {type: has_many, target: Location, via: LoadLocationsByOrgId}
    - {type: has_many, target: Device, via: LoadDevicesSelectListNotInOrganization}
    note: SwitchOrganization confirms a user can hold membership in more than one organization — this is multi-tenant.
  - name: Location
    id_type: uuid
    evidence: LoadLocationMapForDeviceRequest.locationId; operations LoadLocationMapData, LoadLocationsByOrgId
    schema_published: false
    relationships:
    - {type: belongs_to, target: Organization, via: LoadLocationsByOrgId}
    - {type: has_many, target: Device, via: LoadDevicesSelectListNotInLocation}
    - {type: has_one, target: File, via: 'LoadLocationMapForDeviceRequest.dbFileId — the floor-plan/map file'}
  - name: User
    evidence: operations LoadUsersSelectList, LoadRolesForUser, GetPermissionsForUser, PermissionsReqForUser
    schema_published: false
    relationships:
    - {type: has_many, target: Role, via: LoadRolesForUser}
    - {type: belongs_to, target: Organization, via: SwitchOrganization}
  - name: Role
    id_type: uuid
    evidence: PermissionsReq.selectedRoles[]; operations LoadRolesSelectList, LoadRolesForUser
    schema_published: false
    relationships:
    - {type: has_many, target: Permission, via: 'PermissionsReq.grantedPermissions[] / deniedPermissions[]'}
  - name: Permission
    id_type: integer
    evidence: PermissionsReq.grantedPermissions[] and deniedPermissions[] (int32); operations GetPermissions, GetPermissionsForUser
    schema_published: false
    note: >-
      Permissions are integer-coded and carry an explicit grant/deny split, so the model
      supports negative permissions, not just additive grants.
  - name: File
    id_type: uuid
    evidence: LoadLocationMapForDeviceRequest.dbFileId; operations UploadFile, DownloadFile (query param id, uuid), DeleteFile
    schema_published: false
  - name: TelemetryType
    evidence: LoadTelemetryTypesSelectList
    schema_published: false
  - name: ProductType
    evidence: LoadProductTypeSelectList
    schema_published: false
  - name: ConfigChangeType
    evidence: LoadConfigChangeTypeSelectList
    schema_published: false
    note: Implies a device-configuration change log exists behind the portal.
  - name: ColorCodingStatus
    evidence: LoadColorCodingStatusList
    schema_published: false
    note: The severity/status colour scheme surfaced on the portal's device and alert views.
